<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OmniBody Demo Videos | Jewoo Shin</title>
    <meta name="author" content="Jewoo Shin">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" type="text/css" href="../stylesheet.css">
  </head>

  <body>
    <main class="page">
      <header class="demo-header">
        <a class="back" href="../index.html">&larr; Back to homepage</a>
        <h1>OmniBody: Demo Videos</h1>
        <p>Screen captures of the interactive OmniBody web demo, recorded in real time. This page is a work in progress, and more demos will be added.</p>
      </header>

      <!-- Copy a <figure> block to add a video. -->
      <section class="demo-list">
        <figure class="demo">
          <video src="omnibody_cantilevers.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Cantilevers</div>
            <p class="demo-desc">Five cantilever beams with increasing Young&rsquo;s modulus, deflecting under gravity. Darker beams are stiffer.</p>
          </figcaption>
        </figure>

        <figure class="demo">
          <video src="omnibody_mass_spring.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Mass Spring</div>
            <p class="demo-desc">Blocks of different masses suspended from elastic springs.</p>
          </figcaption>
        </figure>

        <figure class="demo">
          <video src="omnibody_cloth_pile.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Cloth Pile</div>
            <p class="demo-desc">Four thin particle-based cloth layers draping over a sphere.</p>
          </figcaption>
        </figure>

        <figure class="demo">
          <video src="omnibody_cloth_trampoline.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Cloth Trampoline</div>
            <p class="demo-desc">A soft sphere bouncing on an elastic, destructible cloth trampoline.</p>
          </figcaption>
        </figure>

        <figure class="demo">
          <video src="omnibody_stacks.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Stacks</div>
            <p class="demo-desc">A stack of nearly rigid cubes, simulated with high stiffness.</p>
          </figcaption>
        </figure>

        <figure class="demo">
          <video src="omnibody_dominoes.mp4" controls muted playsinline preload="metadata"></video>
          <figcaption>
            <div class="demo-title">Dominoes</div>
            <p class="demo-desc">A row of dominoes toppling in a chain reaction.</p>
          </figcaption>
        </figure>
      </section>

      <footer class="site-footer">
        <p>
          Website template from <a href="https://github.com/jonbarron/jonbarron.github.io">Jon Barron</a>.
        </p>
      </footer>
    </main>
  </body>
</html>
